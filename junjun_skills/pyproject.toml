[project]
name = "junjun-skills"
version = "0.1.0"
description = "Agent Skill 注册表"
requires-python = ">=3.11"
dependencies = [
    "langchain-core",
    "httpx",
    "beautifulsoup4",
    "aiohttp",
    "pydantic",
    "websockets",
    "Pillow",
    "feedparser",
    "junjun-core",
    "junjun-llm",
    "junjun-memory"
    # 不声明 junjun-agent / junjun-express：它们声明依赖本包，反向声明成环
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["junjun_skills"]
