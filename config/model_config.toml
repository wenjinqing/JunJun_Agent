# 君君任务模型配置
# 每个任务槽从 env 读 base_url / model / api_key（env 名按槽可配）。
# 默认所有槽共用 DS_BASE_URL / DS_MODEL / DEEPSEEK_API_KEY 一组 env；
# 想让不同任务用不同模型（如 gate 用小模型、agent 用大模型），
# 把对应槽的 *_env 指向另一组 env 即可（见 .env.example 的自定义分组示例）。
#
# 每槽支持 [[task.X.models]] 多条目实现顺序 fallback（主模型故障自动切下一个）：
#   [[task.agent.models]]
#   base_url_env = "DS_BASE_URL"        # 主：deepseek
#   model_env    = "DS_MODEL"
#   api_key_env  = "DEEPSEEK_API_KEY"
#   [[task.agent.models]]
#   base_url_env = "SF_LLM_BASE_URL"    # 备：siliconflow（配了 env 才生效）
#   model_env    = "SF_LLM_MODEL"
#   api_key_env  = "SF_LLM_API_KEY"

[task.gate]
# L2 语义门：小模型，判定 reply / no_reply / no_reply_until_call
temperature = 0.1
max_tokens = 128
base_url_env = "DS_BASE_URL"
model_env = "DS_MODEL"
api_key_env = "DEEPSEEK_API_KEY"

[task.agent]
# 主 Agent：必须支持 function calling。
# 工具选择/指令遵循是瓶颈时，给 agent 单独配一组更强的模型：
# 在 .env 加 AGENT_LLM_BASE_URL / AGENT_LLM_MODEL / AGENT_LLM_API_KEY，
# 然后把下面三个 *_env 改成 AGENT_LLM_*（小模型槽继续用 DS_* 省钱）。
# temperature 0.6：人格活泼与工具调用稳定性的平衡点（0.8 时弱模型工具选择太飘）
temperature = 0.6
max_tokens = 2048
base_url_env = "DS_BASE_URL"
model_env = "DS_MODEL"
api_key_env = "DEEPSEEK_API_KEY"

[task.utils]
# 杂项小任务（频率评估/摘要/提醒文案等）
temperature = 0.3
max_tokens = 512
base_url_env = "DS_BASE_URL"
model_env = "DS_MODEL"
api_key_env = "DEEPSEEK_API_KEY"

[task.utils_small]
# 更轻量的杂项（情绪重评等高频低难度任务）
temperature = 0.3
max_tokens = 256
base_url_env = "DS_BASE_URL"
model_env = "DS_MODEL"
api_key_env = "DEEPSEEK_API_KEY"

[task.vlm]
# 多模态识图（图片描述/表情包注册）。未配置对应 env 时识图链路自动降级为 [图片] 占位
temperature = 0.3
max_tokens = 512
# SiliconFlow Qwen3-VL-32B（支持 image_url 多模态理解）
[[task.vlm.models]]
base_url_env = "SF_VLM_BASE_URL"
model_env = "SF_VLM_MODEL"
api_key_env = "SILICONFLOW_API_KEY"
# 备用组（默认可与主组相同，或指向其他 VLM 提供方）
[[task.vlm.models]]
base_url_env = "VLM_BASE_URL"
model_env = "VLM_MODEL"
api_key_env = "VLM_API_KEY"
